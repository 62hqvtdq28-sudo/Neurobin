<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نقل المنتجات إلى Supabase</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" crossorigin="anonymous"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Cairo',sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .card{background:#1e293b;border-radius:20px;padding:32px;max-width:500px;width:100%;box-shadow:0 25px 50px rgba(0,0,0,0.5)}
  h1{font-size:22px;font-weight:800;color:#fff;margin-bottom:6px}
  .sub{font-size:13px;color:#94a3b8;margin-bottom:24px}
  .btn{width:100%;padding:16px;background:#16a34a;color:#fff;border:none;border-radius:12px;font-size:18px;font-weight:700;font-family:'Cairo',sans-serif;cursor:pointer;transition:all 0.2s}
  .btn:hover{background:#15803d;transform:translateY(-1px)}
  .btn:disabled{background:#475569;cursor:not-allowed;transform:none}
  .log{margin-top:20px;background:#0f172a;border-radius:12px;padding:16px;max-height:300px;overflow-y:auto}
  .log-item{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #1e293b;font-size:13px}
  .log-item:last-child{border-bottom:none}
  .ok{color:#4ade80}
  .err{color:#f87171}
  .info{color:#60a5fa}
  .warn{color:#fbbf24}
  .progress{margin-top:16px;background:#0f172a;border-radius:8px;overflow:hidden;height:8px}
  .progress-bar{height:100%;background:#16a34a;width:0%;transition:width 0.3s;border-radius:8px}
  .count-box{display:flex;justify-content:space-between;margin-top:12px;background:#0f172a;border-radius:10px;padding:12px 16px}
  .count-item{text-align:center}
  .count-num{font-size:24px;font-weight:800;color:#4ade80}
  .count-label{font-size:11px;color:#94a3b8}
  .status-badge{display:inline-flex;align-items:center;gap:6px;background:#1e293b;border:1px solid #334155;border-radius:20px;padding:6px 14px;font-size:12px;margin-bottom:20px}
  .dot{width:8px;height:8px;border-radius:50%;background:#94a3b8}
  .dot.connected{background:#4ade80;animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
  #doneMsg{display:none;background:#14532d;border:1px solid #16a34a;border-radius:12px;padding:16px;margin-top:16px;text-align:center;color:#4ade80;font-weight:700;font-size:16px}
</style>
</head>
<body>
<div class="card">
  <h1>🚀 نقل المنتجات</h1>
  <div class="sub">نقل منتجاتك من هذا الجهاز إلى Supabase حتى يراها جميع العملاء</div>

  <div class="status-badge">
    <div class="dot" id="connDot"></div>
    <span id="connText">جاري الاتصال...</span>
  </div>

  <div class="count-box" id="countBox" style="display:none">
    <div class="count-item">
      <div class="count-num" id="totalCount">0</div>
      <div class="count-label">منتج في جهازك</div>
    </div>
    <div class="count-item">
      <div class="count-num" id="doneCount" style="color:#60a5fa">0</div>
      <div class="count-label">تم النقل</div>
    </div>
    <div class="count-item">
      <div class="count-num" id="failCount" style="color:#f87171">0</div>
      <div class="count-label">فشل</div>
    </div>
  </div>

  <button class="btn" id="migrateBtn" onclick="startMigration()">
    📦 ابدأ النقل إلى Supabase
  </button>

  <div class="progress" id="progressBar" style="display:none">
    <div class="progress-bar" id="bar"></div>
  </div>

  <div id="doneMsg">✅ تم النقل! أعد تحميل موقع العملاء وستظهر المنتجات.</div>

  <div class="log" id="log" style="display:none"></div>
</div>

<script>
const SUPABASE_URL = 'https://hczsskviliuqyayylutv.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhjenNza3ZpbGl1cXlheXlsdXR2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkxNDg2OTUsImV4cCI6MjA5NDcyNDY5NX0.mT-fPrPzwbUx3mQZOqFGx8ndWTkUS-MeqLcfaN1zS4k';

let _sb = null;

function log(msg, type) {
  const el = document.getElementById('log');
  el.style.display = 'block';
  const div = document.createElement('div');
  div.className = 'log-item';
  div.innerHTML = '<span class="'+type+'">'+msg+'</span>';
  el.appendChild(div);
  el.scrollTop = el.scrollHeight;
}

window.addEventListener('DOMContentLoaded', function() {
  try {
    _sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    document.getElementById('connDot').classList.add('connected');
    document.getElementById('connText').textContent = 'متصل بـ Supabase ✓';

    const products = JSON.parse(localStorage.getItem('phProducts') || '[]');
    if (products.length > 0) {
      document.getElementById('countBox').style.display = 'flex';
      document.getElementById('totalCount').textContent = products.length;
      log('✅ وجدت ' + products.length + ' منتج في هذا الجهاز', 'ok');
    } else {
      log('⚠️ لم يتم العثور على منتجات في هذا الجهاز', 'warn');
      log('💡 افتح هذه الصفحة من نفس المتصفح الذي استخدمته في لوحة التحكم', 'info');
    }
  } catch(e) {
    document.getElementById('connText').textContent = '❌ فشل الاتصال';
    log('❌ خطأ: ' + e.message, 'err');
  }
});

async function startMigration() {
  const btn = document.getElementById('migrateBtn');
  const products = JSON.parse(localStorage.getItem('phProducts') || '[]');

  if (!products.length) {
    log('⚠️ لا توجد منتجات للنقل في هذا الجهاز!', 'warn');
    return;
  }

  btn.disabled = true;
  btn.textContent = '⏳ جاري النقل...';
  document.getElementById('progressBar').style.display = 'block';

  let ok = 0, fail = 0;

  for (let i = 0; i < products.length; i++) {
    const p = products[i];
    const pct = Math.round(((i+1) / products.length) * 100);
    document.getElementById('bar').style.width = pct + '%';

    try {
      const { error } = await _sb.from('products').insert({
        name:        p.name || p.nameAr || '',
        name_ar:     p.nameAr || p.name || '',
        category:    p.category || 'other',
        price:       Number(p.price) || 0,
        description: p.description || '',
        image_url:   p.image || '',
        in_stock:    (p.stock === undefined || p.stock > 0),
        stock_level: p.stock > 5 ? 'in' : p.stock > 0 ? 'low' : 'out'
      });
      if (error) throw error;
      ok++;
      document.getElementById('doneCount').textContent = ok;
      log('✅ ' + (p.name || p.nameAr || 'منتج'), 'ok');
    } catch(e) {
      fail++;
      document.getElementById('failCount').textContent = fail;
      log('❌ ' + (p.name || 'منتج') + ': ' + e.message, 'err');
    }
  }

  btn.textContent = '🎉 اكتمل النقل: ' + ok + ' ناجح، ' + fail + ' فشل';
  if (ok > 0) {
    document.getElementById('doneMsg').style.display = 'block';
  }
}
</script>
</body>
</html>
