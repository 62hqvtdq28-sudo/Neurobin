<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Cairo',sans-serif;background:linear-gradient(135deg,#1a2f0e,#2D5016,#3D6B2D);min-height:100vh;direction:rtl}.page-wrap{display:flex;flex-direction:column;align-items:center;padding:32px 16px 48px}.logo-row{display:flex;align-items:center;gap:12px;margin-bottom:40px;text-decoration:none}.logo-emblem{width:48px;height:48px;background:rgba(255,255,255,.15);border-radius:14px;display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.2)}.logo-text{color:#fff;font-size:20px;font-weight:800}.logo-sub{color:rgba(255,255,255,.6);font-size:12px;display:block}.card{background:#fff;border-radius:24px;padding:32px 28px;width:100%;max-width:480px;box-shadow:0 24px 64px rgba(0,0,0,.3)}.card-title{font-size:22px;font-weight:800;color:#1E350F;text-align:center;margin-bottom:6px}.card-sub{font-size:13px;color:#83A962;text-align:center;margin-bottom:28px}.input-group{margin-bottom:14px}.input-group input{width:100%;padding:14px 18px;border:2px solid #E8EAD8;border-radius:14px;font-family:'Cairo',sans-serif;font-size:15px;color:#1E350F;outline:none;background:#F6F7F4;text-align:right}.input-group input:focus{border-color:#5C933B;background:#fff}.input-group input::placeholder{color:#AABF89}.divider{text-align:center;color:#AABF89;font-size:13px;margin:8px 0;font-weight:600}.btn-track{width:100%;padding:15px;background:linear-gradient(135deg,#2D5016,#5C933B);color:#fff;border:none;border-radius:14px;font-family:'Cairo',sans-serif;font-size:16px;font-weight:800;cursor:pointer;margin-top:6px}.btn-track:disabled{opacity:.6;cursor:not-allowed}.order-info{background:#F6F7F4;border-radius:14px;padding:16px 20px;margin-bottom:20px}.order-info-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;font-size:13px}.order-info-label{color:#83A962;font-weight:600}.order-info-value{color:#1E350F;font-weight:700}.tracking-code-badge{background:linear-gradient(135deg,#F59E0B,#D97706);color:#fff;padding:3px 12px;border-radius:20px;font-size:14px;font-weight:900;letter-spacing:2px;font-family:monospace}.progress-title{font-size:14px;font-weight:700;color:#2D5016;margin-bottom:16px;text-align:center}.stages{display:flex;align-items:center;justify-content:space-between;position:relative;margin-bottom:24px}.stages::before{content:'';position:absolute;top:22px;right:10%;left:10%;height:3px;background:#D1D5B1;z-index:0}.stage{display:flex;flex-direction:column;align-items:center;flex:1;position:relative;z-index:1}.stage-circle{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:3px solid #D1D5B1;background:#fff;transition:all .4s}.stage-circle svg{width:20px;height:20px;stroke:#D1D5B1;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:all .4s}.stage.active .stage-circle{border-color:#5C933B;background:#5C933B}.stage.active .stage-circle svg,.stage.done .stage-circle svg{stroke:#fff}.stage.done .stage-circle{border-color:#2D5016;background:#2D5016}.stage.cancelled .stage-circle{border-color:#ef4444;background:#ef4444}.stage-label{font-size:10px;font-weight:700;color:#AABF89;margin-top:8px;text-align:center;line-height:1.3;max-width:64px}.stage.active .stage-label,.stage.done .stage-label{color:#2D5016}.status-pill{display:inline-flex;align-items:center;padding:8px 18px;border-radius:20px;font-size:13px;font-weight:700}.pill-review{background:#FFF7ED;color:#C2410C;border:1px solid #FED7AA}.pill-prepare{background:#EFF6FF;color:#1D4ED8;border:1px solid #BFDBFE}.pill-way{background:#F0FDF4;color:#15803D;border:1px solid #BBF7D0}.pill-done{background:#DCFCE7;color:#15803D;border:1px solid #86EFAC}.pill-cancel{background:#FEF2F2;color:#B91C1C;border:1px solid #FECACA}.live-dot{display:inline-block;width:8px;height:8px;background:#22c55e;border-radius:50%;margin-right:6px;animation:pulse 2s infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}.error-box{background:#FEF2F2;border:1px solid #FECACA;border-radius:14px;padding:16px;text-align:center;color:#B91C1C;font-size:14px;font-weight:600;margin-top:20px}.spinner{width:32px;height:32px;border:3px solid #D1D5B1;border-top-color:#5C933B;border-radius:50%;animation:spin .7s linear infinite;margin:16px auto}@keyframes spin{to{transform:rotate(360deg)}}.back-link{color:rgba(255,255,255,.7);font-size:13px;text-decoration:none;margin-top:20px;display:block;text-align:center}.order-pick{background:#F6F7F4;border-radius:12px;padding:14px 16px;margin-bottom:10px;cursor:pointer;border:2px solid transparent;transition:.2s}.order-pick:hover{border-color:#5C933B}</style></head>
<body><div class='page-wrap'>
<a href='index.html' class='logo-row'><div class='logo-emblem'><svg width='28' height='28' viewBox='0 0 40 40' fill='none'><path d='M12 8L20 32' stroke='#F5D580' stroke-width='2.5' stroke-linecap='round'/><path d='M12 12C12 16 10 20 12C24 14 26 18 26 18' stroke='#F5D580' stroke-width='2' stroke-linecap='round'/></svg></div><div><span class='logo-text'>ph.neurobin</span><span class='logo-sub'>الصيدلي</span></div></a>
<div class='card'><h1 class='card-title'>تتبع طلبك</h1><p class='card-sub'>أدخل كود التتبع أو رقم هاتفك</p>
<div class='input-group'><input type='text' id='codeInput' onkeypress="if(event.key==='Enter')trackOrder()" placeholder='كود التتبع — NB-4827' maxlength='15' autocomplete='off'></div>
<div class='divider'>أو</div>
<div class='input-group'><input type='tel' id='phoneInput' onkeypress="if(event.key==='Enter')trackOrder()" placeholder='رقم هاتفك 07XXXXXXXXX' maxlength='13'></div>
<button class='btn-track' onclick='trackOrder()' id='trackBtn'>تتبع الطلب</button>
<div id='loading' style='display:none'><div class='spinner'></div></div>
<div id='error' style='display:none' class='error-box'></div>
<div id='result' style='display:none;margin-top:24px;'>
  <div class='order-info' id='orderInfo'></div>
  <p class='progress-title'><span class='live-dot'></span>حالة الطلب</p>
  <div class='stages' id='stagesRow'>
    <div class='stage' id='st1'><div class='stage-circle'><svg viewBox='0 0 24 24'><path d='M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2'/><rect x='9' y='3' width='6' height='4' rx='1'/></svg></div><span class='stage-label'>تم التثبيت</span></div>
    <div class='stage' id='st2'><div class='stage-circle'><svg viewBox='0 0 24 24'><path d='M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8'/></svg></div><span class='stage-label'>جاري التجهيز</span></div>
    <div class='stage' id='st3'><div class='stage-circle'><svg viewBox='0 0 24 24'><path d='M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8'/></svg></div><span class='stage-label'>مع المندوب</span></div>
    <div class='stage' id='st4'><div class='stage-circle'><svg viewBox='0 0 24 24'><rect x='1' y='3' width='15' height='13' rx='2'/><path d='M16 8h4l3 3v5h-7V8z'/><circle cx='5.5' cy='18.5' r='2.5'/><circle cx='18.5' cy='18.5' r='2.5'/></svg></div><span class='stage-label'>في الطريق</span></div>
    <div class='stage' id='st5'><div class='stage-circle'><svg viewBox='0 0 24 24'><path d='M5 13l4 4L19 7'/></svg></div><span class='stage-label'>تم التوصيل</span></div>
  </div>
  <div id='statusPill' style='text-align:center;margin-bottom:12px;'></div>
  <div id='multiOrders' style='display:none;'></div>
</div></div>

<script>
var SB_URL='https://hczsskviliuqyayylutv.supabase.co',SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhjenNza3ZpbGl1cXlheXlsdXR2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkxNDg2OTUsImV4cCI6MjA5NDcyNDY5NX0.mT-fPrPzwbUx3mQZOqFGx8ndWTkUS-MeqLcfaN1zS4k';
var _db=supabase.createClient(SB_URL,SB_KEY),RT=null;
var SL={'new':1,'pending':1,'preparing':2,'shipped':3,'progress':4,'on_the_way':4,'delivered':5,'cancelled':0};
var LL={'new':'تم تثبيت طلبكم بنجاح ✅','pending':'تم تثبيت طلبكم بنجاح ✅','preparing':'يتم تجهيز طلبكم','shipped':'تم التسليم للمندوب 📦','progress':'المندوب في الطريق إليكم 🚚','on_the_way':'المندوب في الطريق إليكم 🚚','delivered':'تم التوصيل بنجاح 🎉','cancelled':'تم إلغاء الطلب ❌'};
var PC={'new':'pill-review','pending':'pill-review','preparing':'pill-prepare','shipped':'pill-prepare','progress':'pill-way','on_the_way':'pill-way','delivered':'pill-done','cancelled':'pill-cancel'};
function escH(s){var d=document.createElement('div');d.appendChild(document.createTextNode(String(s)));return d.innerHTML;}
function updateStages(st){var n=SL[st]||1,ic=st==='cancelled';for(var i=1;i<=4;i++){var el=document.getElementById('st'+i);el.className='stage';if(!ic){if(i<n)el.classList.add('done');else if(i===n)el.classList.add('active');}else if(i===1)el.classList.add('cancelled');}document.getElementById('statusPill').innerHTML='<span class="status-pill '+(PC[st]||'pill-review')+'">'+(LL[st]||st)+'</span>';}
function renderOrder(o){var d=(function(){var _d=new Date(o.created_at);var _months=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];return _d.getDate()+' '+_months[_d.getMonth()]+' '+_d.getFullYear();})();document.getElementById('orderInfo').innerHTML='<div class="order-info-row"><span class="order-info-label">العميل</span><span class="order-info-value">'+escH(o.customer_name||'')+'</span></div><div class="order-info-row"><span class="order-info-label">كود التتبع</span><span class="tracking-code-badge">'+escH(o.tracking_code||'—')+'</span></div><div class="order-info-row"><span class="order-info-label">التاريخ</span><span class="order-info-value">'+d+'</span></div>'+(o.total_amount?'<div class="order-info-row"><span class="order-info-label">المجموع</span><span class="order-info-value">'+Number(o.total_amount).toLocaleString('en-US')+' د.ع</span></div>':'')+(function(){var st=o.status||'new';if(st==='delivered'||st==='cancelled')return '';var _today=new Date();var d1=new Date(_today);d1.setDate(d1.getDate()+1);var d2=new Date(_today);d2.setDate(d2.getDate()+2);var _m=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];var _f=function(x){return x.getDate()+' '+_m[x.getMonth()]};var _lbl1='غداً ('+_f(d1)+')';var _lbl2='بعد غداً ('+_f(d2)+')';return '<div class="order-info-row"><span class="order-info-label">التسليم المتوقع</span><span class="order-info-value" style="color:#16a34a;font-size:12px;">📦 '+_lbl1+' – '+_lbl2+'</span></div>'})();updateStages(o.status||'new');if(RT)_db.removeChannel(RT);RT=_db.channel('ord-'+o.id).on('postgres_changes',{event:'UPDATE',schema:'public',table:'orders',filter:'id=eq.'+o.id},function(p){if(p.new)renderOrder(p.new);}).subscribe();}
function showMulti(arr){var h='<p style="font-size:14px;font-weight:700;color:#2D5016;margin-bottom:12px;">آخر طلباتك ('+arr.length+')</p>';arr.forEach(function(o){h+='<div class="order-pick" onclick="pickOrd(\''+o.id+'\')">'+'<div style="display:flex;justify-content:space-between;margin-bottom:4px;"><span style="font-weight:800;font-family:monospace;">'+(o.tracking_code||'—')+'</span><span class="status-pill '+(PC[o.status||'new']||'pill-review')+'" style="font-size:11px;padding:4px 10px;">'+(LL[o.status||'new']||o.status)+'</span></div><span style="font-size:12px;color:#83A962;">'+new Date(o.created_at).toLocaleDateString('en-US')+'</span></div>';});var md=document.getElementById('multiOrders');md.innerHTML=h;md.style.display='block';['orderInfo','stagesRow','statusPill'].forEach(function(x){document.getElementById(x).style.display='none';});}
window.pickOrd=async function(id){var r=await _db.from('orders').select('*').eq('id',id).single();if(r.data){['orderInfo','stagesRow','statusPill'].forEach(function(x){document.getElementById(x).style.display='';});document.getElementById('multiOrders').style.display='none';renderOrder(r.data);}};
async function trackOrder(){var code=document.getElementById('codeInput').value.trim().toUpperCase(),phone=document.getElementById('phoneInput').value.trim().replace(/\s/g,'');if(!code&&!phone){showErr('يرجى إدخال كود التتبع أو رقم الهاتف');return;}setLoad(true);hideErr();document.getElementById('result').style.display='none';try{if(code){var q=await _db.from('orders').select('*').eq('tracking_code',code).is('deleted_at',null).limit(1);if(q.error)throw q.error;if(!q.data||!q.data.length){showErr('لم يُعثر على طلب بهذا الكود');return;}document.getElementById('result').style.display='block';['orderInfo','stagesRow','statusPill'].forEach(function(x){document.getElementById(x).style.display='';});document.getElementById('multiOrders').style.display='none';renderOrder(q.data[0]);}else{var cp=phone.replace(/^\+964/,'0');var q2=await _db.from('orders').select('*').eq('customer_phone',cp).is('deleted_at',null).order('created_at',{ascending:false}).limit(5);if(q2.error)throw q2.error;if(!q2.data||!q2.data.length){showErr('لم يُعثر على طلبات لهذا الرقم');return;}document.getElementById('result').style.display='block';if(q2.data.length===1){['orderInfo','stagesRow','statusPill'].forEach(function(x){document.getElementById(x).style.display='';});document.getElementById('multiOrders').style.display='none';renderOrder(q2.data[0]);}else showMulti(q2.data);}}catch(e){showErr('خطأ: '+e.message);}finally{setLoad(false);}}
function setLoad(v){document.getElementById('loading').style.display=v?'block':'none';document.getElementById('trackBtn').disabled=v;}
function showErr(m){var el=document.getElementById('error');el.textContent=m;el.style.display='block';}
function hideErr(){document.getElementById('error').style.display='none';}
document.addEventListener('DOMContentLoaded',function(){var p=new URLSearchParams(location.search),c=p.get('code'),ph=p.get('phone');if(c){document.getElementById('codeInput').value=c.toUpperCase();trackOrder();}else if(ph){document.getElementById('phoneInput').value=ph;trackOrder();}document.getElementById('codeInput').addEventListener('input',function(){this.value=this.value.toUpperCase();});document.addEventListener('keydown',function(e){if(e.key==='Enter')trackOrder();});});
</script></body></html>
